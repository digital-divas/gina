# Publishes the package to npm when a release is created, but only after the
# end-to-end suite passes on every Node version (see e2e.yml).

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  publish-npm:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

# Installs gina into a separate project and runs init, generate-migration and upgrade
# against a real MySQL 8.0 on every supported Node version. See e2e/run.sh.
# Also called by npm-publish.yml, so a release is only published when this passes.
name: E2E

on:
  push:
  pull_request:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20.10.0', '20', '22', '24']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm run eslint

      - run: npm run test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
